<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Brawler:wght@400;700&family=Manrope:wght@200..800&family=Spicy+Rice&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=logout,add,edit,settings" />
  <script type="module" src="/src/js/main.js"></script>
  <title>The Greenhouse - Back Office</title>
</head>

<body class="auth-pending">
  <main>
    <header>
      <img src="/public/logga.png" alt="The Greenhouse logga">
      <nav>
        <ul>
          <li><a href="menu.html">Meny</a></li>
          <li><a href="orders.html">Beställningar</a></li>
          <li><a href="users.html">Användare</a></li>
        </ul>
      </nav>
      <div class="button-container">
        <button class="logout-btn">
          <span class="material-symbols-outlined icon">logout</span>
          <span>Logga ut</span>
        </button>
      </div>
    </header>
    
    <div class="background">
      <div class="add-product">
        <h2>Lägg till produkt</h2>
        <form id="addProduct" enctype="multipart/form-data">
          <div class="col1">
            <div class="inputs">
              <label for="product-name">Produktnamn:</label>
              <input type="text" name="productName" id="product-name">
            </div>
            <div class="inputs">
              <label for="description">Beskrivning:</label>
              <textarea rows="2" name="description" id="description"></textarea>
            </div>
          </div>
          <div class="col2">
            <div class="inputs">
              <label for="category">Kategori:</label>
              <select name="category" id="category">
                <option value="brunch">Brunch</option>
                <option value="bakery">Bakelser/tårtor</option>
                <option value="sourdough">Bröd</option>
                <option value="hotDrinks">Varma drycker</option>
                <option value="coldDrinks">Kalla drycker</option>
                <option value="cocktails">Drinkar</option>
              </select>
            </div>
            <div class="inputs">
              <label for="allergies">Allergier:</label>
              <textarea rows="2" name="allergies" id="allergies"></textarea>
            </div>
          </div>
          <div class="col3">
            <div class="inputs">
              <label for="price">Pris:</label>
              <input type="number" name="price" id="price">
            </div>
            <div class="inputs">
              <label for="available">Synlig:</label>
              <select name="available" id="available">
                <option value="true">Synlig</option>
                <option value="false">Ej synlig</option>
              </select>
            </div>
            <div class="error-container"></div>
            <button>Spara ny produkt</button>
          </div>
        </form>
      </div>
      <div class="menu-overview"></div>
      <dialog class="menu-modal">

        <h2>Redigera menyprodukt</h2>
        <p class="current-item"></p>

        <form class="edit-menu-form">
          <div class="about-item">
            <div class="menu-input">
              <label for="edit-description">Beskrivning:</label>
              <textarea name="description" id="edit-description" rows="3"></textarea>
            </div>
            <div class="menu-input">
              <label for="edit-allergies">Allergier:</label>
              <textarea name="allergies" id="edit-allergies" rows="3"></textarea>
            </div>
            <div class="menu-input">
              <label for="edit-category">Kategori:</label>
              <select name="category" id="edit-category">
                <option value="brunch">Brunch</option>
                <option value="bakery">Bakelser/tårtor</option>
                <option value="sourdough">Bröd</option>
                <option value="hotDrinks">Varma drycker</option>
                <option value="coldDrinks">Kalla drycker</option>
                <option value="cocktails">Drinkar</option>
              </select>
            </div>
          </div>
          <div class="visibility">
            <div class="edit-inputs">
              <div class="menu-input">
                <label for="edit-visibility">Synlig:</label>
                <select name="available" id="edit-visibility">
                  <option value="true">Synlig</option>
                  <option value="false">Dold</option>
                </select>
              </div>
              <div class="menu-input">
                <label for="edit-price">Pris:</label>
                <input type="number" name="price" id="edit-price">
              </div>
              <button class="editMenu-deleteBtn">Radera produkt</button>
            </div>
            <div class="edit-buttons">
              <button type="submit" id="edit-save">Spara ändringar</button>
              <button type="button" class="close-editModal">Avbryt</button>
            </div>
          </div>

        </form>
      </dialog>
    </div>
  </main>
</body>

</html>
