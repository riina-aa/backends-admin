<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Brawler:wght@400;700&family=Manrope:wght@200..800&family=Spicy+Rice&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=logout,delete" />
  <script type="module" src="/src/js/main.js"></script>
  <title>The Greenhouse - Back Office</title>
</head>

<body class="auth-pending">
  <main>
    <header>
      <img src="/public/logga.png" alt="The Greenhouse logga">
      <nav>
        <ul>
          <li><a href="menu.html">Meny</a></li>
          <li><a href="orders.html">Beställningar</a></li>
          <li><a href="users.html">Användare</a></li>
        </ul>
      </nav>
      <div class="button-container">
        <button class="logout-btn">
          <span class="material-symbols-outlined icon">logout</span>
          <span>Logga ut</span>
        </button>
      </div>
    </header>
    <div class="background">
      <div class="user-content">
        <form id="addUser-form">
          <h2>Lägg till användare</h2>
          <div class="input-container">
            <div class="inputs">
              <label for="">Användarnamn:</label>
              <input type="text" name="username" id="register-username">
            </div>
            <div class="inputs">
              <label for="">Lösenord:</label>
              <input type="password" name="password" id="register-password">
            </div>
            <div id="register-messages"></div>
            <button type="submit">Lägg till användare</button>
          </div>
        </form>
        <div class="user-container">
          <h2>Registrerade användare</h2>
          <div id="userList"></div>
        </div>
        
      </div>
    </div>
  </main>
</body>

</html>
