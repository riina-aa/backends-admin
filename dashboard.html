<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Brawler:wght@400;700&family=Manrope:wght@200..800&family=Spicy+Rice&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=logout" />
    <script type="module" src="/src/js/main.js"></script>
    <title>The Greenhouse - Back Office</title>
  </head>
  <body>
    <main>
      <header>
        <img src="/public/logga.png" alt="The Greenhouse logga">
        <nav>
            <ul>
                <li><a href="dashboard.html">Översikt</a></li>
                <li><a href="menu.html">Meny</a></li>
                <li><a href="messages.html">Meddelanden</a></li>
                <li><a href="orders.html">Beställningar</a></li>
                <li><a href="users.html">Användare</a></li>
            </ul>
        </nav>
        <div class="button-container">
            <button>
                <span class="material-symbols-outlined">logout</span>
                <span>Logga ut</span>
            </button>
        </div>
      </header>
      <div class="background">
            <div class="dashboard-container">
                <div class="dash-menu">
                    <h2>Lägg till på menyn</h2>
                    <div class="inputs">
                        <label for="">Produktnamn:</label>
                        <input type="text" id="" name="">
                    </div>
                    <div class="inputs">
                        <label for="">Beskrivning:</label>
                        <input type="text" id="" name="">
                    </div>
                    <div class="inputs">
                        <label for="">Pris:</label>
                        <input type="number" id="" name="">
                    </div>
                    <div class="inputs">
                        <label for="categories">Kategori:</label>
                        <select name="category" id="categories">
                            <option value="brunch">Brunch</option>
                            <option value="pastries">Konditori</option>
                            <option value="cake">Tårta</option>
                            <option value="hot-beverage">Varm dryck</option>
                            <option value="cold-beverage">Kall dryck</option>
                            <option value="cocktails">Cocktails</option>
                            <option value="bread">Bröd</option>
                        </select>
                    </div>
                    <button type="submit">Lägg till</button>
                </div>
                <div class="dash-messages">
                    <h2>Olästa meddelanden</h2>
                </div>
                <div class="dash-orders">
                    <h2>Nya beställningar</h2>
                </div>
            </div>
      </div>
    </main>
  </body>
</html>
