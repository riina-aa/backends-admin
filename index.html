<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/src/js/main.js"></script>
    <title>The Greenhouse - Back Office</title>
  </head>
  <body>
    <main>
      <header>
        <img src="/public/logga.png" alt="The Greenhouse logga">
      </header>
      <section>
        <h1>The Greenhouse</h1>
        <h2>Back Office</h2>
        <section>
          <h2>Logga in i Back Office</h2>
          <div class="inputs">
            <label for="login-username">Användarnamn:</label>
            <input type="text" id="login-username">
          </div>
          <div class="inputs">
            <label for="login-password">Lösenord:</label>
            <input type="password" id="login-password" name="password">
          </div>
          <button type="submit">Logga in</button>
        </section>
      </section>
      <footer>
        <p>The Greenhouse - Back Office</p>
      </footer>
    </main>
  </body>
</html>
